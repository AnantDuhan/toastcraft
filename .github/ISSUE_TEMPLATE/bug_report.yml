name: Bug report
description: Something isn't working as documented
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A small reproduction makes a bug much faster to fix.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - toastcraft
        - ngx-toastcraft (Angular)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: Run `npm ls toastcraft ngx-toastcraft` to check.
      placeholder: "0.1.4"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Framework and browser
      description: For Angular, include the version and whether the app is zoneless.
      placeholder: "Angular 21, zoneless, Chrome 131 on macOS"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Screenshots or a screen recording help a lot for visual problems.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: A StackBlitz link, a repository, or the smallest code snippet that shows the bug.
      render: ts
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this hasn't been reported yet.
          required: true
