version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates arrive together. Major updates come as separate
      # pull requests, so a breaking change is reviewed on its own.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 removed the JavaScript API that tsup uses to generate .d.ts files.
      # Remove this once tsup supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /angular
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "ng-packagr"]
      other:
        patterns: ["*"]
        exclude-patterns: ["@angular/*", "@angular-devkit/*", "ng-packagr"]
    ignore:
      # Major Angular upgrades change the supported range, so they're done by hand.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
